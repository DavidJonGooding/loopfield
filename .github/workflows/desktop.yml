name: Desktop builds
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Windows portable
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Experimental Mac packages (ad-hoc, not notarized)
        if: runner.os == 'macOS'
        run: npm run dist:mac -- --config.mac.identity=- --config.mac.notarize=false
      - name: Check native Mac app launch and packaged audio engine
        if: runner.os == 'macOS'
        run: |
          node scripts/check-mac-launch.cjs
          npm run smoke -- --packaged
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Loopfield-${{ runner.os }}
          path: |
            dist/v*/Loopfield-*.exe
            dist/v*/Loopfield-*.dmg
            dist/v*/Loopfield-*.zip
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true
      - name: Checksums
        run: cd release-assets && sha256sum Loopfield-* > SHA256SUMS.txt
      - name: Prepare draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --draft --prerelease --title "Loopfield $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
