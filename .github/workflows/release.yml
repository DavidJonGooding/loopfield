name: Publish alpha downloads
on:
  workflow_run:
    workflows: [Desktop builds]
    types: [completed]
permissions:
  contents: read
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: alpha-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Publish new version after successful builds
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Version $TAG already published; leaving its assets unchanged."
            exit 0
          fi
          gh run download "$RUN_ID" -n Loopfield-Windows -D release-assets
          gh run download "$RUN_ID" -n Loopfield-macOS -D release-assets
          (cd release-assets && sha256sum Loopfield-* > SHA256SUMS.txt)
          gh release create "$TAG" release-assets/* --target "$BUILD_SHA" --prerelease --title "Loopfield $TAG alpha" --notes-file docs/RELEASE_NOTES.md
